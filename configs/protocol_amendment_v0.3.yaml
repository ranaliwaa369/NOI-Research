amendment:
  id: "NOI-PROTOCOL-AMENDMENT-0.3"
  version: "0.3.1-prelock"
  status: "preimplementation"
  date: "2026-08-29"
  title: >
    Validation-Lock Correction for Evidence-Derived Reliability
    and Modality Conflict
  project: "Neuro-Olfactive Intelligence"
  owner: "GuardianX LLC"
  authors:
    - "Rana Al-Dahlake"
    - "Jalal Alazirji"

parent_protocol:
  path: "configs/noi_v0.3_protocol.yaml"
  id: "NOI-PROTOCOL-0.3"
  version: "0.3.0-preimplementation"
  tag: "noi-v0.3-preimplementation"
  sha256: "3c2dfa93929462ce28856ea8a16a41d5a2c4fccef3eb0fe5694fe4a6536ab965"
  implementation_commit_before_amendment: "00dc9178f484d1058e9b1ed0cfa672bf977c7a58"

classification:
  stage: "post-feasibility and pre-validation-lock"
  confirmatory_results_inspected: false
  confirmatory_hypotheses_tested: false
  final_test_labels_inspected: false

reason_for_amendment:
  - >
    The feasibility implementation selected the support threshold by
    maximum balanced accuracy, while the registered protocol specifies
    a target validation false-known rate of 0.05.
  - >
    The feasibility uncertainty width of 0.05 and minimum reliability
    value of 0.30 were mechanical pilot constants and were not
    validation-derived lock values.
  - >
    The feasibility fusion implementation consumed a condition-level
    Boolean conflict flag. Because this flag directly identifies the
    contradictory-modalities condition, it cannot serve as a deployable
    evidence-derived conflict detector.
  - >
    The registered conflict threshold therefore cannot be locked until
    a numeric conflict score is computed from modality evidence without
    using condition labels.

locked_corrections:
  support_threshold:
    score: "class_conditional_mahalanobis_distance"
    fitting_source: "training_only"
    calibration_source: "validation_only"
    selection_constraint:
      maximum_validation_false_known_rate: 0.05
    selection_objective:
      primary: "maximum_supported_true_positive_rate"
      secondary: "maximum_balanced_accuracy"
      deterministic_tie_break: "largest_threshold"
    final_test_labels_allowed: false

  uncertainty_band:
    source: "validation_only"
    method: "paired_validation_bootstrap_threshold_interval"
    bootstrap_seed: 4242
    bootstrap_resamples: 10000
    confidence_level: 0.95
    lower_definition: "2.5_percentile_of_bootstrap_thresholds"
    upper_definition: "97.5_percentile_of_bootstrap_thresholds"
    touch_request_rule: >
      Request touch only when the olfactory support score lies inside
      the locked inclusive uncertainty interval and touch is available.
    final_test_labels_allowed: false

  reliability_estimation:
    prohibited_inputs:
      - "condition_label"
      - "support_regime"
      - "modality_conflict_flag"
      - "target_item_id"
      - "target_family_id"
      - "final_test_label"
    required_basis:
      - "available modality vectors"
      - "training-derived modality prototypes"
      - "validation-calibrated retrieval margins"
    reliability_range: "[0, 1]"
    threshold_source: "validation_only"
    calibration_target: >
      Whether the independently retrieved modality-family prediction
      is correct on validation.
    threshold_selection:
      primary: "maximum_balanced_accuracy"
      deterministic_tie_break: "largest_threshold"
    validation_targets_are_model_inputs: false
    final_test_labels_allowed: false

  conflict_detection:
    output: "numeric_conflict_score"
    permitted_inputs:
      - "olfactory modality evidence"
      - "tactile modality evidence"
      - "training-derived modality prototypes"
    prohibited_inputs:
      - "condition_label"
      - "modality_conflict_flag"
      - "conflict donor identity"
      - "target labels"
      - "final-test labels"
    score_definition: >
      One minus the agreement between independently produced
      olfactory-family and tactile-family evidence distributions.
    score_range: "[0, 1]"
    threshold_source: "validation_only"
    calibration_target: >
      Validation-only ground truth indicating whether paired modality
      evidence comes from different target families.
    threshold_selection:
      maximum_validation_false_conflict_rate: 0.05
      primary: "maximum_conflict_true_positive_rate"
      secondary: "maximum_balanced_accuracy"
      deterministic_tie_break: "smallest_threshold"
    validation_targets_are_model_inputs: false
    final_test_labels_allowed: false

  fusion_policy:
    reliability_threshold_source: "validation_only"
    conflict_threshold_source: "validation_only"
    unavailable_modality_weight: 0.0
    conflict_action: "abstain"
    temporal_misalignment_action: "abstain"
    condition_metadata_available_to_model: false

validation_data_policy:
  registered_seeds:
    - 1301
    - 1302
    - 1303
    - 1304
    - 1305
    - 1306
    - 1307
    - 1308
    - 1309
    - 1310
  permitted_splits:
    fitting:
      - "train"
    threshold_derivation:
      - "validation"
  prohibited_splits_before_lock:
    - "final_test"
  validation_unknown_families_must_remain_distinct_from_test: true
  silent_seed_removal_allowed: false

unchanged_commitments:
  hypotheses:
    - "H6"
    - "H7"
    - "H8"
  final_test_events_per_seed: 2000
  final_test_support_allocation:
    seen_item: 800
    known_family_unseen_item: 600
    unseen_family: 600
  paired_conditions:
    - "clean"
    - "degraded_odor"
    - "degraded_touch"
    - "missing_touch"
    - "missing_odor"
    - "contradictory_modalities"
    - "temporal_misalignment"
  statistical_unit: "latent_event_id"
  bootstrap_resamples: 10000
  confidence_level: 0.95
  multiple_testing_correction: "holm"
  negative_and_null_results_must_be_reported: true

interpretation:
  feasibility_pilot_role: "software_and_methodological_checks_only"
  supports_H6: false
  supports_H7: false
  supports_H8: false
  scope: >
    Synthetic computational evaluation only. This amendment does not
    establish biological equivalence, human perceptual validity,
    clinical validity, chemical safety, or deployment readiness.

locking:
  thresholds_may_remain_null_until_validation_derivation: true
  separate_validation_lock_commit_required: true
  separate_validation_lock_tag_required: true
  hashes_required_before_confirmatory_evaluation: true
  threshold_changes_after_lock_allowed: false
