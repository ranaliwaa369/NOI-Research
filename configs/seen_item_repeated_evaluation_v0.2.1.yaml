protocol:
  name: "NOI Seen-Item Repeated Evaluation"
  version: "0.2.1"
  status: "prespecified_preimplementation"
  date: "2026-08-27"
  owner: "GUARDIANX LLC"

scope:
  evaluation_track: "Track A: Seen-item episodic retrieval"
  evidence_type: "synthetic computational evaluation only"
  modifies_v0_1_results: false
  modifies_existing_track_a_result: false

provenance:
  development_branch: "development-v0.2"
  locked_track_a_commit: "01054da"
  pilot_result_path: "results/v0.2/seen_item_track_a_results.json"
  pilot_result_sha256: "7b75efb63f939b435fbcf8fee652457190df1dd9309a6c177e998f5d1cb8fffc"

pilot_reference:
  generator_seed: 1001
  ood_seed: 9001
  partition_seed: 2102
  inspected_before_repeated_run_lock: true
  include_in_primary_ten_seed_aggregate: false
  use: "context and implementation validation only"

primary_runs:
  include_pilot_reference: false
  independent_run_count: 10
  runs:
    - run_id: "seed-01"
      generator_seed: 1101
      ood_seed: 9101
      partition_seed: 2201
    - run_id: "seed-02"
      generator_seed: 1201
      ood_seed: 9201
      partition_seed: 2301
    - run_id: "seed-03"
