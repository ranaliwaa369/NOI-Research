dataset:
  events_per_run: 10000
  training_fraction: 0.70
  validation_fraction: 0.10
  ood_fraction: 0.20
  calibration_template_fraction: 0.50
  require_final_target_reachability: true
  prohibit_template_overlap: true
  prohibit_event_overlap: true
  prohibit_final_test_tuning: true
  prohibit_ood_use: true

systems:
  - "memory_only"
  - "ridge_only"
  - "hybrid"

metrics:
  primary: "mean_reciprocal_rank"
  secondary:
    - "recall_at_1"
    - "recall_at_10"
    - "ndcg_at_10"
    - "reachable_event_fraction"

primary_comparison:
  direction: "memory_only minus ridge_only"
  pairing: "within identical final-test events"
  independent_replication_unit: "seed"
  report_every_seed: true
  retain_negative_and_null_results: true

statistics:
  confidence_level: 0.95
  bootstrap_seed: 4243
  bootstrap_resamples: 10000
  primary_interval_unit: "seed"
  paired_seed_differences: true
  report_mean_difference: true
  report_median_difference: true
  report_standard_deviation: true
  report_minimum_and_maximum: true
  multiple_testing_method: "holm"

reproducibility:
  deterministic: true
  version_all_seed_values: true
  export_per_seed_results: true
  export_aggregate_results: true
  hash_every_export: true
  record_environment_versions: true
  oracle_use_prohibited: true

prohibited_claims:
  - "Human olfactory equivalence"
  - "Human perceptual validity"
  - "Clinical effectiveness"
  - "Physical odor-emission safety"
  - "Real-world deployment readiness"
  - "Statistical generalization beyond synthetic evidence"
