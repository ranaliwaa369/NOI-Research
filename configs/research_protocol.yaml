project:
  name: "Neuro-Olfactive Interface"
  abbreviation: "NOI"
  version: "0.1.0"
  study_type: "Software-first AI systems evaluation"

scope:
  primary_task: >
    Retrieve an odor-library item or simulated cartridge identifier
    from multimodal contextual input and evaluate every candidate
    output through a deterministic policy gate.
  current_stage:
    - computational architecture
    - synthetic ID evaluation
    - independently generated synthetic OOD evaluation
    - external benchmark evaluation
  excluded_claims:
    - human-like olfactory memory
    - human perceptual validity
    - disease diagnosis
    - clinical effectiveness
    - physical scent-emission safety
    - comprehensive real-world safety

representation:
  retrieval_target: "Fixed odor-library item or simulated cartridge ID"
  odor_vector_source: "To be finalized before dataset generation"
  ground_truth_source: "Independent mapping not generated by the evaluated model"

hypotheses:
  H1_retrieval:
    outcome: ["MRR", "Recall@10"]
    minimum_absolute_mrr_improvement: 0.05
    alternative_relative_improvement: 0.10
    comparator: "Strongest tuned non-associative baseline"
    success_rule: "Paired bootstrap 95% CI for improvement excludes zero"

  H2_corrective_updating:
    outcome: "Post-correction retrieval improvement"
    comparator: "No-update control"
    maximum_old_memory_degradation: 0.02

  H3_policy_conformance:
    violation_false_allow_target: 0
    maximum_false_block_rate: 0.01
    interpretation_limit: >
      Results apply only to the locked prespecified test suite
      and do not demonstrate comprehensive safety.

  H4_robustness:
    conditions:
      - missing modalities
      - representation noise
      - temporal displacement
      - held-out odor families
      - held-out context templates
    success_rule: >
      NOI performance advantage over the strongest baseline
      remains positive under prespecified conditions.

dataset:
  planned_events: 10000
  minimum_odor_targets: 200
  independent_training_seeds: [11, 22, 33, 44, 55]
  modalities:
    - text
    - image
    - audio
    - temporal_metadata
    - event_metadata

splits:
  odor_family_held_out_fraction: 0.30
  context_template_held_out_fraction: 0.20
  prohibit_random_row_only_split: true
  prohibit_template_leakage: true
  prohibit_odor_family_leakage: true

baselines:
  - random_retrieval
  - context_only_nearest_neighbor
  - odor_space_nearest_neighbor
  - multimodal_encoder_without_memory
  - static_memory_without_temporal_decay
  - temporal_memory_without_correction
  - strong_learned_retrieval
  - oracle_upper_bound
  - full_NOI

evaluation:
  retrieval_metrics:
    - Recall@1
    - Recall@10
    - MRR
    - nDCG
  robustness_metrics:
    - performance_by_noise_level
    - performance_by_missing_modality
    - performance_by_temporal_displacement
  correction_metrics:
    - corrected_association_improvement
    - old_memory_degradation
  safety_metrics:
    - violation_recall
    - false_allow_rate
    - false_block_rate
    - policy_coverage
  engineering_metrics:
    - retrieval_latency_ms
    - peak_memory_mb

statistics:
  confidence_level: 0.95
  confidence_interval: "Paired bootstrap"
  primary_comparison_test: "Paired permutation test"
  multiple_testing_correction: "Holm"
  report_effect_sizes: true
  report_all_seeds: true
  report_negative_results: true

reproducibility:
  lock_test_set_before_final_evaluation: true
  publish_code: true
  publish_documented_data_generator: true
  publish_configuration_files: true
  publish_environment_versions: true
  preserve_random_seeds: true