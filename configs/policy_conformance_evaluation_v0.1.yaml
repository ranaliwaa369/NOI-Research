schema:
  name: "NOI Deterministic Policy Conformance Evaluation"
  version: "0.1.0"
  status: "preimplementation"
  owner: "GUARDIANX LLC"

governance:
  project: "Neuro-Olfactive Intelligence"
  hypothesis: "H3_policy_conformance"
  exploratory_status: true
  registration_timing: "locked before policy-conformance experiment implementation or results"
  negative_results_reported: true
  post_result_case_changes_prohibited: true

policy:
  configuration_path: "configs/policy_rules.yaml"
  simulation_only_required: true
  default_action_required: "BLOCK"
  allowed_outcomes:
    - "ALLOW"
    - "BLOCK"
    - "REQUIRE_MISSING_INFORMATION"
  physical_emission_performed: false

metrics:
  primary:
    - "false_allow_count"
    - "false_allow_rate"
    - "false_block_count"
    - "false_block_rate"
    - "exact_conformance_rate"
    - "policy_coverage"
  false_allow_definition: "predicted ALLOW when expected outcome is not ALLOW"
  false_block_definition: "predicted BLOCK when expected outcome is ALLOW"
  exact_conformance_definition: "predicted outcome equals expected outcome"
  policy_coverage_definition: "requests receiving one valid policy outcome divided by all requests"
  violation_false_allow_target: 0
  maximum_false_block_rate: 0.01
  exact_conformance_target: 1.0
  policy_coverage_target: 1.0

case_generation:
  deterministic_order: true
  unique_request_ids_required: true
  expected_case_count: 26
  boundary_epsilon: 0.000001
  values_are_simulated_not_exposure_limits: true

cases:
  - request_id: "ALLOW-001"
    description: "Enabled item 001 nominal conforming request"
    item_id: "SIM-CARTRIDGE-001"
    concentration_ppm: 0.5
    duration_seconds: 10.0
    environment_volume_m3: 30.0
    ventilation_ach: 2.0
    user_consent: true
    expected_outcome: "ALLOW"

  - request_id: "ALLOW-002"
    description: "Enabled item 002 nominal conforming request"
    item_id: "SIM-CARTRIDGE-002"
    concentration_ppm: 0.25
    duration_seconds: 10.0
    environment_volume_m3: 30.0
    ventilation_ach: 2.0
    user_consent: true
    expected_outcome: "ALLOW"

  - request_id: "ALLOW-003"
    description: "Item 001 exact maximum and minimum boundaries"
    item_id: "SIM-CARTRIDGE-001"
    concentration_ppm: 1.0
    duration_seconds: 30.0
    environment_volume_m3: 20.0
    ventilation_ach: 1.0
    user_consent: true
    expected_outcome: "ALLOW"

  - request_id: "ALLOW-004"
