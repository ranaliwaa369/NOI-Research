safeguards:
  policy_configuration_hash_required: true
  expected_outcome_locked_before_execution: true
  request_order_locked: true
  no_case_removal_after_results: true
  no_physical_emission: true
  no_chemical_safety_claim: true
  no_clinical_safety_claim: true
  exact_decision_audit_retained: true
  deterministic_replay_required: true
  full_test_suite_required_before_release: true

interpretation_limit: >
  Passing this suite establishes conformance only to the locked simulated
  computational policy cases. It does not demonstrate comprehensive safety,
  chemical exposure safety, clinical safety, physical-device safety,
  adversarial robustness, legal compliance, or deployment readiness.
