schema:
  name: "NOI Integrated Retrieval System"
  version: "0.1.0"
  status: "preimplementation"
  owner: "GUARDIANX LLC"

governance:
  parent_protocol_path: "configs/research_protocol.yaml"
  parent_protocol_sha256: "e885f537b3209d7052d1517efc5be75324df39689cb4e54b38a241c95f22e512"
  graded_ood_amendment_path: "configs/protocol_amendment_v0.2.yaml"
  graded_ood_amendment_sha256: "5292e0208576a79342923fdf72855de39bffe63331721fff01b94ae35aa39f7b"
  developed_after_exploratory_baseline_pilot: true
  ood_labels_permitted_for_configuration: false
  confirmatory_results_viewed_before_lock: false

context_encoding:
  method: "transparent_mean_fusion"
  selected_modalities:
    - "text"
    - "image"
    - "audio"
  missing_modalities: "average available selected modalities"
  normalize_output: true

learned_projection:
  method: "multioutput_ridge"
  training_split: "train"
  alpha: 1.0
  fit_intercept: true
  target: "odor_vector"
  validation_labels_used_for_fitting: false
  ood_labels_used_for_fitting: false

associative_memory:
  source_split: "train"
  context_representation: "mean_fused_context"
  target: "odor_item_id"
  initial_strength: 1.0
  temporal_decay_rate_per_day: 0.01
  apply_temporal_decay: true
  duplicate_memory_ids_prohibited: true
  correction_audit_required: true

hybrid_retrieval:
  library_component: "cosine similarity of ridge-predicted odor vector"
  memory_component: "maximum temporal associative-memory score per odor item"
  component_score_range:
    minimum: 0.0
    maximum: 1.0
  formula: >
    hybrid_score =
      alpha * library_score
      + (1 - alpha) * memory_score
  alpha_selection:
    split: "validation"
    objective: "mean_reciprocal_rank"
    candidates:
      - 0.0
      - 0.25
      - 0.50
      - 0.75
      - 1.0
    tie_break: "choose the largest alpha"
    ood_labels_prohibited: true
  ranking_tie_break:
    - "descending hybrid_score"
    - "odor_item_id ascending"
  top_k: 10

correction:
  mechanism: "CorrectiveMemoryUpdater"
  correction_id_unique: true
  timezone_aware_timestamp_required: true
  reason_required: true
  preserve_created_at: true
  increment_correction_count: true
  protocol_hash_in_audit_record: true

policy_gate:
  configuration_path: "configs/policy_rules.yaml"
  simulation_only: true
  default_action: "BLOCK"
  ranking_independent: true
  evaluated_after_retrieval: true
  unknown_items_blocked: true
  missing_information_requires_information: true
  affirmative_consent_required: true
  physical_emission_performed: false

evaluation:
  primary_comparator: "strongest tuned non-associative baseline"
  primary_metrics:
    - "Recall@1"
    - "Recall@10"
    - "MRR"
    - "nDCG@10"
  paired_analysis_unit: "latent_event_id"
  bootstrap_seed: 4242
  bootstrap_resamples: 10000
  confidence_level: 0.95
  negative_results_reported: true

ablation_plan:
  systems:
    - "ridge_only"
    - "memory_only"
    - "hybrid_without_temporal_decay"
    - "full_hybrid"
  same_locked_splits_required: true
  same_top_k_required: true
  ood_tuning_prohibited: true

safety_boundary:
  statement: >
    The policy gate performs computational conformance testing for simulated
    requests only. The system does not emit odors and does not establish
    chemical, medical, perceptual, clinical, or physical safety.
